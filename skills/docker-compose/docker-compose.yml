services:
  mariadb:
    image: mariadb:11.4
    container_name: bms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: bms_main
      MYSQL_USER: bms
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

  adminer:
    image: adminer:latest
    container_name: bms-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - mariadb

  web:
    image: php:8.2-apache
    container_name: bms-web
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ../sites/main:/var/www/html/main:cached
      - ./apache-vhosts.conf:/etc/apache2/sites-enabled/000-default.conf
    command: >
      bash -c "docker-php-ext-install pdo_mysql mysqli &&
               a2enmod rewrite &&
               apache2-foreground"
    depends_on:
      - mariadb
